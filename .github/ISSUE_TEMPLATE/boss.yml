name: Boss proposal
description: Propose a new boss or a rework of an existing one
title: "[boss] "
labels: ["boss", "design"]
body:
  - type: input
    id: name
    attributes:
      label: Boss name and epithet
      placeholder: Sentinel of Ash — Keeper of the Cindered Gate
    validations:
      required: true
  - type: textarea
    id: fantasy
    attributes:
      label: What should the fight feel like?
      description: The player experience, in two or three sentences. Telegraph reading, positioning, endurance — which one is this fight testing?
    validations:
      required: true
  - type: textarea
    id: attacks
    attributes:
      label: Attack list
      description: One line per attack — telegraph / active / recovery frames, damage, range, which phase unlocks it.
      placeholder: |
        ash_cleave  melee  18/6/24  22 dmg  0-52px   phase 1
        pyre_descent area  22/10/34 34 dmg  0-64px   phase 3
    validations:
      required: true
  - type: input
    id: poise
    attributes:
      label: HP and poise
      placeholder: "780 HP / 140 poise"
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Design rules (see docs/design/ACTION_BATTLE_SPEC.md)
      options:
        - label: Every attack telegraphs for at least 7 frames
          required: true
        - label: Phase 2 adds reach and phase 3 adds speed, not just damage
          required: true
        - label: The boss has at least one 30+ frame recovery window
          required: true
        - label: No assets from Nintendo or Team Cherry are involved
          required: true
