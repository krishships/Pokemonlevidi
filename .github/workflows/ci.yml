name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-and-core:
    name: data + battle core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate boss data
        run: python3 tools/validate_bosses.py

      - name: Generated tables are current
        run: python3 tools/gen_bosses.py --check

      - name: Reject committed ROMs and binaries
        run: |
          set -e
          bad=$(git ls-files | grep -Ei '\.(gba|gbc|gb|nds|sav|state|bps|ups|ips|xdelta)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::ROM/save/patch files must never be committed:"
            echo "$bad"
            exit 1
          fi
          big=$(git ls-files -z | xargs -0 -r du -k | awk '$1 > 2048 {print $2}' || true)
          if [ -n "$big" ]; then
            echo "::error::files over 2 MB (add an explicit allowlist entry if intentional):"
            echo "$big"
            exit 1
          fi

      - name: Build host tests
        run: make test

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-log
          path: build/
          if-no-files-found: ignore

  rom-build:
    name: GBA ROM
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain check
        run: |
          arm-none-eabi-gcc --version | head -1
          make --version | head -1

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential libpng-dev python3 git

      - name: Fetch pinned pokeemerald base
        run: bash tools/fetch_base.sh

      - name: Graft hack sources onto the engine
        run: bash tools/graft.sh

      - name: Build ROM
        run: bash tools/build_rom.sh

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: heart-and-soul-gba
          path: dist/*.gba
          if-no-files-found: error

  red-build:
    name: GB ROM (Pokemon Red)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install RGBDS 1.0.4
        run: |
          curl -sL -o rgbds.tar.xz \
            https://github.com/gbdev/rgbds/releases/download/v1.0.4/rgbds-linux-x86_64.tar.xz
          mkdir -p "$HOME/rgbds"
          # the tarball has no top-level directory: extract as-is
          tar -xJf rgbds.tar.xz -C "$HOME/rgbds"
          chmod +x "$HOME/rgbds"/rgb*
          ls -l "$HOME/rgbds"
          echo "$HOME/rgbds" >> "$GITHUB_PATH"

      - name: Verify assembler
        run: |
          export PATH="$HOME/rgbds:$PATH"
          rgbasm --version
          rgblink --version

      - name: Clone pret/pokered
        run: git clone --depth 1 https://github.com/pret/pokered.git base/pokered

      - name: Build Red and Blue
        run: |
          export PATH="$HOME/rgbds:$PATH"
          make -C base/pokered -j"$(nproc)"

      - name: Upload ROMs
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-red-gb
          path: |
            base/pokered/*.gb
            base/pokered/*.gbc
          if-no-files-found: error
