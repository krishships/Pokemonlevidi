name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: Page tests (headless browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm i --silent puppeteer-core@24
          npx --yes puppeteer browsers install chrome
      - name: Unit tests (pure functions)
        run: node tests/pure.test.js
      - name: Run UI test
        run: node tests/ui.test.js
      - name: Two-model split (eyes vs brain)
        run: node tests/split.test.js
      - name: Every button, no runtime errors
        run: node tests/smoke.test.js
