name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emerald:
    name: Emerald ROM (GBA)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          arm-none-eabi-gcc --version | head -1
          make --version | head -1

      - name: Dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential libpng-dev python3 git

      - name: Fetch pinned pokeemerald
        run: bash tools/fetch_base.sh

      - name: Build
        run: bash tools/build_rom.sh

      - name: Validate ROM header
        run: python3 tools/romcheck.py dist/emerald.gba

      - uses: actions/upload-artifact@v4
        with:
          name: emerald-gba
          path: dist/*.gba
          if-no-files-found: error

  red:
    name: Red ROM (GB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install RGBDS 1.0.4
        run: |
          curl -sL -o rgbds.tar.xz \
            https://github.com/gbdev/rgbds/releases/download/v1.0.4/rgbds-linux-x86_64.tar.xz
          mkdir -p "$HOME/rgbds"
          tar -xJf rgbds.tar.xz -C "$HOME/rgbds"
          chmod +x "$HOME/rgbds"/rgb*
          echo "$HOME/rgbds" >> "$GITHUB_PATH"

      - name: Clone pret/pokered
        run: git clone --depth 1 https://github.com/pret/pokered.git base/pokered

      - name: Apply mods
        run: |
          shopt -s nullglob
          for p in patches/red/*.patch; do
            echo "applying $p"
            git -C base/pokered apply "$(pwd)/$p"
          done

      - name: Build
        run: make -C base/pokered -j"$(nproc)"

      - name: Build headless boot test
        run: |
          git clone --depth 1 https://github.com/binji/binjgb.git base/binjgb
          cc -O2 -std=gnu99 -Ibase/binjgb/src \
             tools/boottest.c \
             base/binjgb/src/memory.c base/binjgb/src/common.c \
             base/binjgb/src/options.c base/binjgb/src/emulator.c \
             base/binjgb/src/joypad.c -lm -o boottest

      - name: Boot test (headless)
        run: ./boottest base/pokered/pokered.gbc 600

      - uses: actions/upload-artifact@v4
        with:
          name: red-gb
          path: |
            base/pokered/*.gb
            base/pokered/*.gbc
          if-no-files-found: error

  ui:
    name: Whisper page (headless browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm i --silent puppeteer-core@24
          npx --yes puppeteer browsers install chrome
      - name: Run UI test
        run: node tests/ui.test.js
