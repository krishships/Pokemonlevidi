name: Build latest Emerald

# Run by hand: Actions > Build latest Emerald > Run workflow.
# No ROM is needed. The decompilation compiles its own .gba from source.
# Pick the plain decomp or the Expansion ("EE"), and a branch or tag.

on:
  workflow_dispatch:
    inputs:
      source:
        description: Which base to build
        type: choice
        default: pokeemerald-expansion
        options:
          - pokeemerald-expansion
          - pokeemerald
      ref:
        description: Branch or tag (master = newest)
        type: string
        default: master

jobs:
  build:
    name: Build ${{ inputs.source }} @ ${{ inputs.ref }}
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential libpng-dev python3 git

      - name: Fetch source
        run: |
          case "${{ inputs.source }}" in
            pokeemerald-expansion) URL=https://github.com/rh-hideout/pokeemerald-expansion.git ;;
            pokeemerald)           URL=https://github.com/pret/pokeemerald.git ;;
          esac
          git init -q src
          git -C src remote add origin "$URL"
          git -C src fetch -q --depth 1 origin "${{ inputs.ref }}"
          git -C src checkout -q FETCH_HEAD
          echo "building $(git -C src rev-parse --short HEAD) from $URL"

      - name: Build
        run: |
          if [ "${{ inputs.source }}" = "pokeemerald" ]; then
            make -C src -j"$(nproc)" MODERN=1
          else
            make -C src -j"$(nproc)"
          fi

      - name: Collect ROM and map
        run: |
          mkdir -p dist
          cp src/pokeemerald.gba dist/emerald.gba
          cp src/pokeemerald.map dist/emerald.map
          python3 tools/romcheck.py dist/emerald.gba
          SIZE=$(stat -c%s dist/emerald.gba)
          echo "size: $SIZE bytes"
          [ "$SIZE" -gt 15000000 ] || { echo "ROM looks truncated"; exit 1; }

      - name: Fingerprint
        shell: bash
        run: |
          SHA=$(sha256sum dist/emerald.gba | cut -d' ' -f1)
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          {
            echo "## Download the ROM"
            echo ""
            echo "Scroll to **Artifacts** at the bottom of this page and download"
            echo "**\`emerald-latest\`**. Unzip it for \`emerald.gba\`."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| source | ${{ inputs.source }} |"
            echo "| ref | ${{ inputs.ref }} |"
            echo "| size | $(stat -c%s dist/emerald.gba) bytes |"
            echo "| sha256 | \`$SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: emerald-latest
          path: dist/
          retention-days: 30
          if-no-files-found: error
