name: Publish site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  package:
    name: Package site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanity check the pages
        run: |
          test -f site/index.html
          python3 - <<'PY2'
import re, pathlib, sys
bad = 0
for f in pathlib.Path("site").glob("*.html"):
    h = f.read_text()
    if "<canvas" not in h and "canvas" not in h:
        print("warn: no canvas in", f)
    if h.count("<script") < 1:
        print("error: no script in", f); bad = 1
    print(f"{f.name}: {len(h)//1024} KB")
sys.exit(bad)
PY2
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: package
    runs-on: ubuntu-latest
    # Pages must be enabled once by hand: Settings -> Pages -> Source: GitHub Actions
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
