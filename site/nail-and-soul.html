<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Nail &amp; Soul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#eef3ff; --dim:#8fa3c4; --gold:#ffd479; --bg:#05070c;
  --font-display:'Bricolage Grotesque',Georgia,serif;
  --font-mono:'Fragment Mono','SF Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);overflow:hidden;
  font-family:var(--font-mono);color:var(--ink);
  -webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
#stage{position:fixed;inset:0;display:grid;place-items:center;
  background:radial-gradient(ellipse at 50% 40%,#0d1420 0%,#05070c 70%)}
canvas{display:block;image-rendering:auto;border-radius:2px;
  box-shadow:0 0 0 1px rgba(150,180,230,.10),0 30px 80px -30px rgba(0,0,0,.9)}
#pad{position:fixed;inset:auto 0 0 0;display:none;justify-content:space-between;
  padding:14px 18px 22px;pointer-events:none}
#pad .cluster{display:flex;gap:12px;pointer-events:auto}
.btn{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;
  color:rgba(220,232,255,.82);background:rgba(150,180,230,.10);
  border:1px solid rgba(150,180,230,.22);backdrop-filter:blur(6px);
  transition:transform .06s ease,background .06s ease}
.btn.wide{width:76px}
.btn.held{background:rgba(255,212,121,.26);border-color:rgba(255,212,121,.55);
  transform:scale(.94);color:#fff}
.btn--gold{color:var(--gold);border-color:rgba(255,212,121,.34)}
#whisper{position:fixed;left:0;right:0;bottom:96px;display:none;align-items:center;
  gap:8px;padding:0 14px;z-index:6;pointer-events:none}
#whisper>*{pointer-events:auto}
.wchip{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;padding:7px 9px;
  border-radius:6px;color:rgba(220,232,255,.7);background:rgba(150,180,230,.10);
  border:1px solid rgba(150,180,230,.20);white-space:nowrap}
#whisper-input{flex:1;min-width:0;background:rgba(10,14,20,.8);color:#eef3ff;
  border:1px solid rgba(255,212,121,.28);border-radius:8px;padding:9px 12px;
  font-family:var(--font-mono);font-size:12px;outline:none}
#whisper-input::placeholder{color:rgba(190,210,240,.35)}
#whisper-send{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  color:var(--gold);background:rgba(255,212,121,.14);border:1px solid rgba(255,212,121,.35)}
@media (pointer:coarse){#whisper{bottom:110px}}
#mute{position:fixed;top:14px;right:16px;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;font-size:15px;color:rgba(220,232,255,.6);
  background:rgba(150,180,230,.08);border:1px solid rgba(150,180,230,.18);
  cursor:pointer;z-index:5;user-select:none}
#mute.off{color:rgba(220,232,255,.22);text-decoration:line-through}
@media (pointer:coarse){#pad{display:flex}}
@media (max-width:520px){.btn{width:56px;height:56px;font-size:10px}.btn.wide{width:66px}}
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="960" height="540"></canvas></div>

<div id="mute" title="mute (M)">&#9834;</div>

<div id="whisper">
  <div class="wchip" data-whisper="attack">ATTACK</div>
  <div class="wchip" data-whisper="wait">HOLD</div>
  <div class="wchip" data-whisper="catch">CATCH</div>
  <div class="wchip" data-whisper="run">FLEE</div>
  <input id="whisper-input" type="text" placeholder="whisper to him..." maxlength="60" autocomplete="off">
  <div id="whisper-send">&#10148;</div>
</div>

<div id="pad">
  <div class="cluster">
    <div class="btn" data-key="left">&#9664;</div>
    <div class="btn" data-key="right">&#9654;</div>
  </div>
  <div class="cluster">
    <div class="btn btn--gold" data-key="focus">FOCUS</div>
    <div class="btn" data-key="dash">DASH</div>
    <div class="btn" data-key="jump">JUMP</div>
    <div class="btn wide" data-key="attack">NAIL</div>
  </div>
</div>

  /* Progression order: gentle telegraphs first, brutal last. The array is
     sorted in place so the title screen's 1-9 numbering matches difficulty. */
  const DIFFICULTY_ORDER = [
    'sentinel_of_ash', 'siltmaw_grazer', 'mossback_warden', 'lanternhusk_pilgrim',
    'glasswing_chorister', 'blade_dancer', 'rustbell_colossus', 'vellum_widow',
    'thornchoir_regent'
  ];
  BOSSES.sort((a, b) => DIFFICULTY_ORDER.indexOf(a.id) - DIFFICULTY_ORDER.indexOf(b.id));

  function rngNext(s) {
    let x = s >>> 0;
    x ^= x << 13; x >>>= 0;
    x ^= x >> 17;
    x ^= x << 5; x >>>= 0;
    return x === 0 ? 0x9e3779b9 : x;
  }

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  function overlap(ax, ay, facing, reach, height, tx, ty) {
    let dx = tx - ax;
    if (facing === 0) dx = -dx;
    if (dx < -18) return false;
    if (dx > reach) return false;
    return Math.abs(ty - ay) <= height;
  }

  class Battle {
    constructor(bossDef, seed) {
      this.def = bossDef;
      this.rng = (seed >>> 0) || 0x1234567;
      this.frame = 0;
      this.events = [];
      this.outcome = 'ongoing';
      this.shake = 0;
      this.slowmo = 0;

      this.player = {
        x: 300, y: FLOOR, vy: 0, vx: 0, facing: 1, onGround: true,
        masks: P.masks, soul: 0, iframes: 0, hurt: 0,
        dashT: 0, dashCd: 0, swingT: 0, swingCd: 0, focusT: 0,
        poise: P.playerPoise, poiseBreak: 0, anim: 0, dead: false
      };

      this.companion = {
        x: 150, y: FLOOR, facing: 1, hp: 3, maxHp: 3,
        state: 'wander', timer: 30, cd: 0, swingT: 0,
        energy: 100, curiosity: 65, mood: 'curious',
        memory: [], say: '', sayT: 0, kills: 0
      };

      this.boss = {
        x: 660, y: FLOOR, facing: -1, hp: bossDef.hp, maxHp: bossDef.hp,
        poise: bossDef.poise, maxPoise: bossDef.poise, phase: 1,
        state: 'idle', stateT: 0, atk: null, atkStage: 'none', atkT: 0,
        hitDone: false, cd: 50, iframes: 0, staggerT: 0, flash: 0, anim: 0,
        dead: false
      };
    }

    emit(type, data) { this.events.push(Object.assign({ type }, data || {})); }

    phaseForHp(hp) {
      const pct = (hp / this.def.hp) * 100;
      if (pct <= this.def.phase3) return 3;
      if (pct <= this.def.phase2) return 2;
      return 1;
    }

    pickAttack() {
      const b = this.boss;
      let pool = [], total = 0;
      for (const a of this.def.attacks) {
        if (a.minPhase <= b.phase && a.weight > 0) { pool.push(a); total += a.weight; }
      }
      if (!total) return null;
      let roll = this.rng % total;
      this.rng = rngNext(this.rng);
      for (const a of pool) {
        if (roll < a.weight) return a;
        roll -= a.weight;
      }
      return pool[pool.length - 1];
    }

    scaledCooldown() {
      const base = this.def.aggression;
      const f = this.boss.phase === 3 ? 0.55 : this.boss.phase === 2 ? 0.78 : 1;
      return Math.max(18, Math.round(base * f));
    }

    hurtPlayer(dmg, poiseDmg) {
      const p = this.player;
      if (p.iframes > 0 || p.dead) return false;
      p.masks -= dmg;
      p.iframes = P.iframes;
      p.hurt = P.hurtFrames;
      p.focusT = 0;
      p.dashT = 0;
      p.vy = -4.2;
      p.vx = -p.facing * 2.4;
      this.shake = 9;
      this.emit('hitPlayer', { x: p.x, y: p.y - 40 });
      if (p.masks <= 0) { p.masks = 0; p.dead = true; this.outcome = 'lost'; this.emit('death'); }
      return true;
    }

    hurtBoss(dmg, poiseDmg) {
      const b = this.boss;
      if (b.dead || b.iframes > 0) return;
      b.hp = Math.max(0, b.hp - dmg);
      b.flash = 4;
      this.emit('hitBoss', { x: b.x, y: b.y - 90 });
      this.shake = Math.max(this.shake, 4);

      const want = this.phaseForHp(b.hp);
      if (want > b.phase) {
        b.phase = want;
        b.state = 'phase';
        b.stateT = 46;
        b.iframes = 46;
        b.atkStage = 'none';
        b.atk = null;
        this.shake = 14;
        this.emit('phase', { phase: want });
        return;
      }
      b.poise -= poiseDmg;
      if (b.poise <= 0) {
        b.poise = b.maxPoise;
        b.state = 'stagger';
        b.staggerT = 56;
        b.atkStage = 'none';
        b.atk = null;
        this.emit('stagger');
      }
      if (b.hp <= 0) {
        b.dead = true;
        this.outcome = 'won';
        this.emit('bossDeath');
      }
    }

    step(input) {
      if (this.outcome !== 'ongoing') return this.outcome;
      this.events.length = 0;
      this.frame++;
      if (this.shake > 0) this.shake *= 0.86;

      this.stepPlayer(input);
      this.stepBoss();
      this.stepCompanion();
      return this.outcome;
    }

    stepPlayer(input) {
      const p = this.player;
      const b = this.boss;
      p.anim++;

      if (p.iframes > 0) p.iframes--;
      if (p.dashCd > 0) p.dashCd--;
      if (p.swingCd > 0) p.swingCd--;
      if (p.hurt > 0) p.hurt--;

      p.poise = Math.min(P.playerPoise, p.poise + P.poiseRegen);

      // gravity
      p.vy = Math.min(P.maxFall, p.vy + P.gravity);
      p.y += p.vy;
      if (p.y >= FLOOR) {
        if (!p.onGround && p.vy > 4) this.emit('land', { x: p.x });
        p.y = FLOOR;
        p.vy = 0;
        p.onGround = true;
      } else {
        p.onGround = false;
      }

      if (input.catch && b.hp > 0 && b.hp / b.maxHp <= 0.15 && b.state !== 'phase' && p.hurt === 0) {
        this.captureT = (this.captureT || 0) + 1;
        if (this.captureT >= 36) {
          b.dead = true;
          this.outcome = 'captured';
          this.emit('capture', { x: b.x, y: b.y - 70 });
        }
        return;
      }
      this.captureT = 0;

      if (p.hurt > 0) {
        p.x = clamp(p.x + p.vx, 40, W - 40);
        p.vx *= 0.9;
        return;
      }

      if (p.dashT > 0) {
        p.dashT--;
        p.x += p.facing === 1 ? P.dashSpeed : -P.dashSpeed;
        p.x = clamp(p.x, 40, W - 40);
        p.iframes = Math.max(p.iframes, 2);
        if (p.dashT === 0) this.emit('dashEnd');
        return;
      }

      if (input.focus && p.soul >= P.focusCost && p.onGround) {
        p.focusT++;
        if (p.focusT % 6 === 0) this.emit('focusTick', { x: p.x, y: p.y - 30 });
        if (p.focusT >= P.focusFrames) {
          p.focusT = 0;
          p.soul -= P.focusCost;
          p.masks = Math.min(P.masks, p.masks + P.healAmount);
          this.emit('heal', { x: p.x, y: p.y - 40 });
        }
        return;
      }
      p.focusT = 0;

      if (input.dash && p.dashCd === 0) {
        p.dashT = P.dashFrames;
        p.dashCd = P.dashCd;
        p.iframes = P.dashIframes;
        this.emit('dash', { x: p.x, y: p.y, facing: p.facing });
        return;
      }

      if (input.left && !input.right) { p.x -= P.speed; p.facing = 0; }
      else if (input.right && !input.left) { p.x += P.speed; p.facing = 1; }
      p.x = clamp(p.x, 40, W - 40);

      if (input.jump && p.onGround) {
        p.vy = P.jumpV;
        p.onGround = false;
        this.emit('jump', { x: p.x });
      }

      if (p.swingT > 0) {
        p.swingT--;
        if (p.swingT <= 7 && p.swingT >= 4) {
          if (overlap(p.x, p.y, p.facing, P.nailReach, P.nailHeight, b.x, b.y)) {
            this.hurtBoss(P.nailDmg, P.nailPoise);
            p.soul = Math.min(P.soulMax, p.soul + P.soulPerHit);
          }
        }
      } else if (input.attack && p.swingCd === 0) {
        p.swingT = P.swingFrames;
        p.swingCd = P.swingCd;
        this.emit('slash', { x: p.x, y: p.y, facing: p.facing });
      }

      if (b.hp > 0) p.facing = b.x >= p.x ? 1 : 0;
    }

    companionIdleLine() {
      const c = this.companion;
      const lines = c.energy < 45
        ? ['Getting tired of this.', 'My arms hurt. I did not have arms before.',
           'How are you not winded?']
        : ['Watch the shoulders. That is the tell.', 'I have no body where I come from.',
           'Stay behind me.', 'It telegraphs everything. Everything.',
           'You see how it resets? That is the window.',
           'Rain. I have read about rain. It is different wet.',
           'Every time I am hurt I am surprised. That will fade, I think.'];
      return lines[Math.floor(Math.random() * lines.length)];
    }

    companionSay(line, frames) {
      const c = this.companion;
      c.say = line;
      c.sayT = frames || 110;
      this.emit('companionSay', { text: line });
    }

    stepCompanion() {
      const c = this.companion, b = this.boss, p = this.player;
      if (c.sayT > 0) c.sayT--;
      if (c.cd > 0) c.cd--;
      if (c.timer > 0) c.timer--;
      if (c.swingT > 0) c.swingT--;
      if (b.dead || this.outcome !== 'ongoing') { c.state = 'idle'; return; }

      // --- decide, roughly twice a second
      if (c.timer === 0) {
        const hpFrac = b.hp / b.maxHp;
        const dist = Math.abs(b.x - c.x);

        if (c.hp <= 1) {
          if (c.state !== 'retreat') this.companionSay('Too much. Falling back.', 90);
          c.state = 'retreat';
          c.mood = 'wary';
          c.timer = 50;
        } else if (c.energy < 22) {
          if (c.state !== 'rest') this.companionSay('Need a breath...', 80);
          c.state = 'rest';
          c.mood = 'tired';
          c.timer = 70;
        } else if (hpFrac <= 0.15 && c.curiosity > 40) {
          c.state = 'catch';
          c.mood = 'excited';
          c.timer = 26;
        } else if (c.curiosity > 45 || dist < 180) {
          c.state = 'engage';
          c.mood = 'focused';
          c.timer = 34;
        } else {
          c.state = 'wander';
          c.mood = 'bored';
          c.timer = 40;
        }
        // curiosity drifts: he gets bored of standing still, braver when healthy
        c.curiosity = clamp(c.curiosity + (Math.random() * 14 - 7) + (c.hp > 2 ? 2 : -4), 0, 100);
      }

      // --- act
      switch (c.state) {
        case 'retreat': {
          const away = b.x > c.x ? -1 : 1;
          c.x = clamp(c.x + away * 1.9, 40, W - 40);
          c.facing = away > 0 ? 1 : 0;
          c.energy = Math.min(100, c.energy + 0.55);
          if (c.hp < c.maxHp && c.energy > 70 && Math.random() < 0.01) c.hp++;
          break;
        }
        case 'rest': {
          c.energy = Math.min(100, c.energy + 1.1);
          if (c.hp < c.maxHp && Math.random() < 0.02) c.hp++;
          if (c.energy >= 92) { c.state = 'wander'; c.timer = 0; }
          break;
        }
        case 'wander': {
          if (c.sayT === 0 && Math.random() < 0.006) this.companionSay(this.companionIdleLine(), 120);
          const drift = Math.sin(this.frame * 0.02 + 1.7) * 1.2;
          c.x = clamp(c.x + drift, 60, W - 60);
          c.facing = drift > 0 ? 1 : 0;
          c.energy = Math.min(100, c.energy + 0.12);
          break;
        }
        case 'catch': {
          // he tries the same capture the player can
          c.timer--;
          if (c.timer <= 0) {
            if (b.hp / b.maxHp <= 0.15) {
              this.companionSay('Mine.', 90);
              c.kills++;
              b.dead = true;
              this.outcome = 'captured';
              this.emit('capture', { x: b.x, y: b.y - 70 });
            } else {
              c.state = 'engage';
            }
          }
          break;
        }
        case 'engage': {
          const dir = b.x > c.x ? 1 : -1;
          c.facing = dir > 0 ? 1 : 0;
          const dist = Math.abs(b.x - c.x);
          if (dist > 46) {
            c.x = clamp(c.x + dir * 2.3, 40, W - 40);
          } else if (c.cd === 0) {
            c.swingT = 10;
            c.cd = 34;
            c.energy = Math.max(0, c.energy - 1.6);
            if (Math.abs(b.x - c.x) <= 50) {
              this.hurtBoss(1, 10);
              if (b.hp <= 0 && c.kills >= 0) { c.kills++; }
              c.energy = Math.max(0, c.energy - 0.8);
            }
          }
          break;
        }
        default: break;
      }

      // he reacts when the boss changes phase
      if (c.lastPhase === undefined) c.lastPhase = b.phase;
      if (b.phase !== c.lastPhase) {
        c.lastPhase = b.phase;
        this.companionSay(b.phase === 3 ? 'It is done playing. Stay sharp.' : 'Here it comes — new tricks.', 130);
        c.curiosity = clamp(c.curiosity + 18, 0, 100);
      }

      // he takes splash damage from area attacks
      if (b.state === 'attack' && b.atkStage === 'act' && b.atk && b.atk.kind === 'area') {
        if (Math.abs(b.x - c.x) <= b.atk.reach && c.cd === 0 && Math.random() < 0.02) {
          c.hp = Math.max(0, c.hp - 1);
          c.energy = Math.max(0, c.energy - 8);
          c.cd = 40;
          this.companionSay('Ow — rude.', 70);
        }
      }
    }

    stepBoss() {
      const b = this.boss;
      const p = this.player;
      b.anim++;
      if (b.flash > 0) b.flash--;
      if (b.iframes > 0) b.iframes--;

      if (b.dead) return;

      if (b.state === 'phase') {
        if (--b.stateT <= 0) { b.state = 'idle'; b.cd = 26; }
        return;
      }
      if (b.state === 'stagger') {
        if (--b.staggerT <= 0) { b.state = 'idle'; b.cd = 14; }
        return;
      }
      if (b.state === 'attack') { this.stepAttack(); return; }

      // idle
      b.facing = p.x >= b.x ? 1 : -1;
      if (b.cd > 0) { b.cd--; return; }

      const dx = Math.abs(p.x - b.x);
      const atk = this.pickAttack();
      if (atk && dx >= 0 && dx <= atk.reach + 20) {
        b.atk = atk;
        b.state = 'attack';
        b.atkStage = 'tel';
        b.atkT = atk.tel;
        b.hitDone = false;
        this.emit('telegraph', { x: b.x, y: b.y, kind: atk.kind, id: atk.id });
        return;
      }
      if (dx > 110) b.x += b.facing * this.def.walk;
      else if (dx < 60) b.x -= b.facing * this.def.walk * 0.8;
      b.x = clamp(b.x, 90, W - 90);
      b.cd = 8;
    }

    stepAttack() {
      const b = this.boss;
      const p = this.player;
      const a = b.atk;

      if (b.atkT > 0) b.atkT--;

      if (b.atkStage === 'tel') {
        b.facing = p.x >= b.x ? 1 : -1;
        if (b.atkT <= 0) { b.atkStage = 'act'; b.atkT = a.act; this.emit('swing', { x: b.x, y: b.y }); }
        return;
      }
      if (b.atkStage === 'act') {
        if (a.lunge) {
          b.x = clamp(b.x + b.facing * a.lunge, 80, W - 80);
        }
        if (!b.hitDone && overlap(b.x, b.y, b.facing === 1 ? 1 : 0, a.reach, a.height, p.x, p.y)) {
          b.hitDone = true;
          this.hurtPlayer(a.dmg, a.poise);
        }
        if (b.atkT <= 0) { b.atkStage = 'rec'; b.atkT = a.rec; }
        return;
      }
      if (b.atkStage === 'rec' && b.atkT <= 0) {
        b.atkStage = 'none';
        b.atk = null;
        b.state = 'idle';
        b.cd = this.scaledCooldown();
      }
    }
  }

  const api = { W, H, FLOOR, FPS, P, BOSSES, Battle, overlap, clamp };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.SIM = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =====================================================================
   sfx.js - procedural Web Audio sound module for a Hollow Knight-style
   action game.  No audio files, no <audio> elements, no libraries:
   every sound is synthesised at runtime from oscillators and generated
   noise buffers.

   API
     SFX.init()            create/resume the AudioContext (call on the
                           first user gesture)
     SFX.play(name, opts)  fire one of the 15 named sounds
     SFX.setVolume(v)      0..1 master volume
     SFX.mute(bool)        hard mute, independent of volume

   Sounds: slash hit hurt dash jump land telegraph swing phase stagger
           heal capture death victory defeat

   Safe to call play() before init() - it is a silent no-op.
   ===================================================================== */
(function (root) {
  'use strict';

  var AC = root.AudioContext || root.webkitAudioContext;

  var ctx = null;        // AudioContext
  var master = null;     // master gain
  var noiseBuf = null;   // shared 2s white-noise buffer
  var volume = 0.8;
  var muted = false;

  /* ------------------------------------------------------------------
     Node bookkeeping
     Every sound builds one Voice.  A Voice owns every node it created
     and tears the whole graph down once its sources have ended, so
     repeated calls cannot leak nodes (a classic Web Audio bug).
     ------------------------------------------------------------------ */
  function V() {
    this.nodes = [];
    this.sources = [];
  }

  V.prototype.node = function (n) {
    this.nodes.push(n);
    return n;
  };

  V.prototype.source = function (n) {
    this.nodes.push(n);
    this.sources.push(n);
    return n;
  };

  /* Stop every source at endTime, then disconnect everything.
     Both onended and a timer are used: onended alone is not reliable
     (background tabs, sources already past their stop time). */
  V.prototype.release = function (endTime) {
    var self = this;
    var done = false;

    function finish() {
      if (done) return;
      done = true;
      for (var i = 0; i < self.nodes.length; i++) {
        var n = self.nodes[i];
        if (n.onended) n.onended = null;
        try { n.disconnect(); } catch (e) { /* already gone */ }
      }
      self.nodes.length = 0;
      self.sources.length = 0;
    }

    if (!this.sources.length) { finish(); return; }

    var left = this.sources.length;
    var hook = function (src) {
      src.onended = function () {
        src.onended = null;
        if (--left <= 0) finish();
      };
      try {
        src.stop(endTime);
      } catch (e) {
        try { src.stop(); } catch (e2) { /* ignore */ }
      }
    };
    for (var i = 0; i < this.sources.length; i++) hook(this.sources[i]);

    var ms = Math.max(0, (endTime - ctx.currentTime) * 1000) + 250;
    setTimeout(finish, ms);
  };

  /* ------------------------------------------------------------------
     Context / master
     ------------------------------------------------------------------ */
  function makeNoise(seconds) {
    var len = Math.max(1, Math.floor(ctx.sampleRate * seconds));
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  }

  function applyGain() {
    if (!master) return;
    var target = muted ? 0 : volume;
    var t = ctx.currentTime;
    try {
      master.gain.cancelScheduledValues(t);
      master.gain.setTargetAtTime(target, t, 0.012);
    } catch (e) {
      master.gain.value = target;
    }
  }

  function resume() {
    if (ctx && ctx.state === 'suspended' && typeof ctx.resume === 'function') {
      var p = ctx.resume();
      if (p && typeof p.catch === 'function') p.catch(function () {});
    }
  }

  function init() {
    if (!AC) return null;                 // browser without Web Audio
    if (!ctx) {
      try {
        ctx = new AC();
      } catch (e) {
        ctx = null;
        return null;
      }
      master = ctx.createGain();
      master.gain.value = muted ? 0 : volume;
      // gentle limiter so stacked voices never clip
      var comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -12;
      comp.knee.value = 24;
      comp.ratio.value = 8;
      comp.attack.value = 0.003;
      comp.release.value = 0.18;
      master.connect(comp);
      comp.connect(ctx.destination);
      noiseBuf = makeNoise(2);
    }
    resume();
    return ctx;
  }

  /* ------------------------------------------------------------------
     Building blocks
     ------------------------------------------------------------------ */

  // Per-voice output bus -> master.
  function bus(v) {
    var g = v.node(ctx.createGain());
    g.gain.value = 1;
    g.connect(master);
    return g;
  }

  function noiseSrc(v) {
    var s = v.source(ctx.createBufferSource());
    s.buffer = noiseBuf;
    s.loop = true;
    return s;
  }

  function filter(v, type, freq, q) {
    var f = v.node(ctx.createBiquadFilter());
    f.type = type;
    f.frequency.value = freq;
    if (q != null) f.Q.value = q;
    return f;
  }

  // Steady or gliding oscillator note with a percussive envelope.
  function tone(v, dest, t, f0, dur, type, peak, attack, f1) {
    var o = v.source(ctx.createOscillator());
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);

    var g = v.node(ctx.createGain());
    var a = attack == null ? Math.min(0.012, dur * 0.3) : attack;
    var p = Math.max(0.0002, peak);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(p, t + Math.max(0.002, a));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    o.connect(g);
    g.connect(dest);
    o.start(t);
    return g;
  }

  // Filtered noise burst; the filter sweeps from f0 to f1.
  function noiseBurst(v, dest, t, dur, type, f0, f1, q, peak) {
    var s = noiseSrc(v);
    var f = filter(v, type, f0, q);
    if (f1 && f1 !== f0) {
      f.frequency.setValueAtTime(f0, t);
      f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    }
    var g = v.node(ctx.createGain());
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + Math.min(0.02, dur * 0.35));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f);
    f.connect(g);
    g.connect(dest);
    s.start(t, Math.random() * 1.5);
    return g;
  }

  /* ------------------------------------------------------------------
     The 15 sounds.  Each gets a start time t and ends well under 400ms.
     ------------------------------------------------------------------ */
  var sounds = {

    /* nail swing: bright filtered-noise sweep with a metallic edge */
    slash: function (t) {
      var v = new V(), o = bus(v);
      noiseBurst(v, o, t, 0.16, 'bandpass', 900, 7500, 1.3, 0.55);
      noiseBurst(v, o, t + 0.01, 0.09, 'highpass', 4000, 6500, 0.8, 0.18);
      tone(v, o, t, 1500, 0.09, 'triangle', 0.07, 0.004, 2600);
      v.release(t + 0.22);
    },

    /* impact on enemy: low thud + short noise burst */
    hit: function (t) {
      var v = new V(), o = bus(v);
      tone(v, o, t, 150, 0.19, 'sine', 0.85, 0.003, 48);
      tone(v, o, t, 300, 0.09, 'triangle', 0.22, 0.002, 110);
      noiseBurst(v, o, t, 0.07, 'lowpass', 2600, 320, 0.9, 0.5);
      v.release(t + 0.23);
    },

    /* player takes damage: dissonant, slightly harsh low tone */
    hurt: function (t) {
      var v = new V(), o = bus(v);
      var lp = filter(v, 'lowpass', 1500, 0.9);
      lp.connect(o);
      tone(v, lp, t, 147, 0.32, 'square', 0.24, 0.006, 98);
      tone(v, lp, t + 0.005, 156, 0.30, 'sawtooth', 0.20, 0.006, 104);
      noiseBurst(v, o, t, 0.16, 'lowpass', 900, 400, 0.8, 0.20);
      v.release(t + 0.36);
    },

    /* whoosh: noise through a bandpass sweeping down */
    dash: function (t) {
      var v = new V(), o = bus(v);
      noiseBurst(v, o, t, 0.26, 'bandpass', 3600, 340, 2.4, 0.45);
      tone(v, o, t, 210, 0.22, 'sine', 0.10, 0.02, 78);
      v.release(t + 0.30);
    },

    /* soft airy blip */
    jump: function (t) {
      var v = new V(), o = bus(v);
      tone(v, o, t, 380, 0.12, 'triangle', 0.16, 0.012, 640);
      noiseBurst(v, o, t, 0.08, 'highpass', 1800, 3200, 0.7, 0.07);
      v.release(t + 0.16);
    },

    /* short soft thud */
    land: function (t) {
      var v = new V(), o = bus(v);
      tone(v, o, t, 96, 0.14, 'sine', 0.5, 0.003, 48);
      noiseBurst(v, o, t, 0.06, 'lowpass', 1100, 400, 0.8, 0.20);
      v.release(t + 0.18);
    },

    /* rising warning tone, pitched by opts.pitch (0..1) - audible, not shrill */
    telegraph: function (t, opts) {
      var p = (opts && typeof opts.pitch === 'number') ? opts.pitch : 0.5;
      p = p < 0 ? 0 : (p > 1 ? 1 : p);
      var f = 300 + p * 520;             // 300 Hz .. 820 Hz
      var v = new V(), o = bus(v);
      tone(v, o, t, f, 0.30, 'sine', 0.20, 0.06, f * 1.9);
      tone(v, o, t, f * 1.5, 0.30, 'triangle', 0.06, 0.07, f * 2.85);
      noiseBurst(v, o, t, 0.30, 'bandpass', f * 2, f * 4, 3, 0.05);
      v.release(t + 0.34);
    },

    /* boss weapon sweep: heavier and lower than 'slash' */
    swing: function (t) {
      var v = new V(), o = bus(v);
      noiseBurst(v, o, t, 0.30, 'lowpass', 1400, 220, 0.9, 0.5);
      noiseBurst(v, o, t, 0.28, 'bandpass', 520, 150, 1.6, 0.3);
      tone(v, o, t, 110, 0.26, 'sine', 0.35, 0.01, 45);
      v.release(t + 0.34);

    /* phase change roar: detuned low sweep plus noise */
    phase: function (t) {
      var v = new V(), o = bus(v);
      var lp = filter(v, 'lowpass', 900, 1.2);
      lp.connect(o);
      tone(v, lp, t, 58, 0.32, 'sawtooth', 0.22, 0.02, 140);
      tone(v, lp, t, 61.5, 0.32, 'sawtooth', 0.22, 0.02, 148);
      tone(v, lp, t, 66, 0.32, 'sawtooth', 0.20, 0.02, 158);
      tone(v, o, t, 41, 0.32, 'sine', 0.30, 0.02, 72);
      noiseBurst(v, o, t, 0.30, 'bandpass', 350, 950, 1.1, 0.28);
      v.release(t + 0.36);
    },

    /* metallic clang with fast decay (inharmonic partials) */
    stagger: function (t) {
      var v = new V(), o = bus(v);
      noiseBurst(v, o, t, 0.045, 'highpass', 2800, 4200, 0.8, 0.32);
      tone(v, o, t, 1180, 0.16, 'sine', 0.14, 0.001);
      tone(v, o, t, 1760, 0.12, 'sine', 0.12, 0.001);
      tone(v, o, t, 2540, 0.09, 'sine', 0.09, 0.001);
      tone(v, o, t, 3310, 0.06, 'triangle', 0.06, 0.001);
      v.release(t + 0.20);
    },

    /* warm rising shimmer */
    heal: function (t) {
      var v = new V(), o = bus(v);
      var notes = [523.25, 659.25, 783.99];
      for (var i = 0; i < notes.length; i++) {
        var n = notes[i], at = t + i * 0.08;

      noiseBurst(v, o, t, 0.32, 'bandpass', 2400, 5200, 2, 0.035);
      v.release(t + 0.36);
    },

    /* 3-note ascending chime */
    capture: function (t) {
      var v = new V(), o = bus(v);
      var notes = [523.25, 659.25, 783.99];
      for (var i = 0; i < notes.length; i++) {
        var n = notes[i], at = t + i * 0.10;
        tone(v, o, at, n, 0.18, 'sine', 0.22, 0.004);
        tone(v, o, at, n * 2, 0.12, 'sine', 0.06, 0.004);

    /* descending minor figure (D minor) */
    death: function (t) {
      var v = new V(), o = bus(v);
      var lp = filter(v, 'lowpass', 2200, 0.8);
      lp.connect(o);
      var notes = [440.00, 349.23, 293.66];
      for (var i = 0; i < notes.length; i++) {
        var at = t + i * 0.11;
        var dur = i === notes.length - 1 ? 0.15 : 0.14;
        tone(v, lp, at, notes[i], dur, 'triangle', 0.20, 0.008);
        tone(v, o, at, notes[i] * 0.5, dur, 'sine', 0.10, 0.008);
      }
      v.release(t + 0.38);
    },

    /* short 4-note fanfare */
    victory: function (t) {
      var v = new V(), o = bus(v);
      var notes = [523.25, 659.25, 783.99, 1046.50];
      for (var i = 0; i < notes.length; i++) {
        var at = t + i * 0.08;
        var dur = i === notes.length - 1 ? 0.14 : 0.11;
        tone(v, o, at, notes[i], dur, 'triangle', 0.18, 0.005);
        tone(v, o, at, notes[i] * 2, dur * 0.8, 'sine', 0.06, 0.005);

    defeat: function (t) {

      tone(v, lp, t, 110, 0.36, 'sawtooth', 0.28, 0.03, 55);
      tone(v, lp, t, 111.5, 0.36, 'sawtooth', 0.18, 0.03, 55.5);
      tone(v, o, t, 55, 0.34, 'sine', 0.26, 0.03, 27.5);
      v.release(t + 0.37);
    }
  };

  /* ------------------------------------------------------------------
     Public API
     ------------------------------------------------------------------ */
  function play(name, opts) {
    if (!ctx || muted) return;             // silent no-op before init()
    var fn = sounds[name];
    if (typeof fn !== 'function') return;
    resume();                              // mobile autoplay guard
    try {
      fn(ctx.currentTime + 0.002, opts || {});
    } catch (e) {
      /* never let a missing sound break the game loop */
    }
  }

  function setVolume(v) {
    volume = typeof v === 'number' && isFinite(v) ? Math.min(1, Math.max(0, v)) : 0.8;
    applyGain();
  }

  function mute(on) {
    muted = !!on;
    applyGain();

    play: play,
    setVolume: setVolume,

/* AUTOPILOT — a policy that plays the player character.
 * Reads battle state, returns { ...input, decision }. No learning, no model:
 * a hand-written policy with a priority ladder. Deterministic.
 */
(function (root) {
  'use strict';

  const REACH = 48;          // nail reach, px
  const SAFE_DASH = 26;      // dash cooldown margin

  function think(b, t, whisper) {
    const p = b.player, bo = b.boss;
    const dx = bo.x - p.x;
    const adx = Math.abs(dx);
    const dirRight = dx > 0 ? 1 : 0;
    const atk = bo.atk;
    const stage = bo.atkStage;
    const incoming = bo.state === 'attack' && (stage === 'tel' || stage === 'act');
    const telLeft = atk && stage === 'tel' ? bo.atkT : 0;
    const inReach = adx <= REACH + 6;
    const lowHp = p.masks <= 2;

    const out = { left: 0, right: 0, jump: 0, attack: 0, dash: 0, focus: 0, catch: 0, decision: 'WAIT' };
    const order = whisper && whisper.ttl > 0 ? whisper.intent : null;

    // a whisper outranks instinct for as long as it lasts
    if (order === 'retreat') {
      out.right = dirRight ? 0 : 1;
      out.left = dirRight ? 1 : 0;
      if (incoming && p.dashCd === 0) out.dash = 1;
      out.decision = 'OBEY: RETREAT';
      return out;
    }
    if (order === 'hold') {
      if (adx < 120) {
        out.right = dirRight ? 0 : 1;
        out.left = dirRight ? 1 : 0;
      }
      if (incoming && p.dashCd === 0) out.dash = 1;
      out.decision = 'OBEY: HOLD';
      return out;
    }
    if (order === 'heal' && p.soul >= 33 && bossBusy) {
      out.focus = 1;
      out.decision = 'OBEY: HEAL';
      return out;
    }
    if (order === 'catch' && bo.hp / bo.maxHp <= 0.35 && !incoming) {
      if (bo.hp / bo.maxHp <= 0.15) { out.catch = 1; out.decision = 'OBEY: CATCH'; return out; }
      out.decision = 'OBEY: WEAKEN';
    }

    // 1. finish it — capture beats a kill
    if (bo.hp > 0 && bo.hp / bo.maxHp <= 0.15 && !incoming) {
      out.catch = 1;
      out.decision = 'CAPTURE';
      return out;
    }

    // 2. heal only when the boss cannot reach us
    const bossBusy = stage === 'rec' || bo.state === 'stagger' || bo.state === 'phase' || bo.cd > 10;
    if (lowHp && p.soul >= 33 && bossBusy) {
      out.focus = 1;
      out.decision = 'HEAL';
      return out;
    }

    // 3. dodge: dash through the active window, away if we are nearly dead
    if (incoming && p.dashCd === 0) {
      const threat = adx <= (atk ? atk.reach + 26 : 90);
      if (threat && stage === 'tel' && telLeft <= 14) {
        out.dash = 1;
        if (p.masks <= 2) {
          out.right = dirRight ? 0 : 1;
          out.left = dirRight ? 1 : 0;
          out.decision = 'RETREAT';
        } else {
          out.right = dirRight ? 1 : 0;
          out.left = dirRight ? 0 : 1;
          out.decision = 'DASH-THROUGH';
        }
        return out;
      }
      if (threat && stage === 'act') {
        out.dash = 1;
        out.right = dirRight ? 1 : 0;
        out.left = dirRight ? 0 : 1;
        out.decision = 'DASH-THROUGH';
        return out;
      }
    }

    // 4. jump ground-only attacks
    if (incoming && atk && atk.height <= 26 && adx < atk.reach && p.onGround) {
      out.jump = 1;
      out.decision = 'JUMP';
      return out;
    }

    // 5. in range and not swinging? strike
    const eager = order === 'attack';
    if ((inReach || (eager && adx < REACH + 26)) && p.swingCd === 0 && (!incoming || stage === 'rec' || eager)) {
      out.attack = 1;
      out.decision = 'STRIKE';
      return out;
    }

    // 6. otherwise close the gap, backing off during an active window
    if (stage === 'act' && adx < (atk ? atk.reach : 80)) {
      out.right = dirRight ? 0 : 1;
      out.left = dirRight ? 1 : 0;
      out.decision = 'BACK OFF';
      return out;
    }
    out.right = dirRight ? 1 : 0;
    out.left = dirRight ? 0 : 1;
    out.decision = 'APPROACH';
    return out;
  }

  const api = { think };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.AUTOPILOT = api;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* WHISPER — the player is a voice, not a body.
 * Turns a message into an intent the pilot obeys for a while. Without an API
 * this is keyword matching; with one, the same interface carries real language.
 */
(function (root) {
  'use strict';

  const RULES = [
    { intent: 'attack',  words: ['attack', 'strike', 'hit', 'fight', 'kill', 'go', 'push', 'aggressive'] },
    { intent: 'hold',    words: ['wait', 'stop', 'hold', 'stay', 'careful', 'slow', 'no'] },
    { intent: 'catch',   words: ['catch', 'take', 'capture', 'mine', 'keep', 'friend'] },
    { intent: 'retreat', words: ['run', 'flee', 'back', 'away', 'escape', 'hide'] },
    { intent: 'heal',    words: ['heal', 'rest', 'breath', 'recover', 'mend'] },
    { intent: 'bless',   words: ['arceus', 'god', 'bless', 'light', 'guide', 'believe'] }
  ];

  const ACK = {
    attack:  ['As you say.', 'Then I go.', 'Yes. Forward.', 'I hear you.'],
    hold:    ['I will wait.', 'As you wish.', 'Holding.', 'You are right. Patience.'],
    catch:   ['Mine, then.', 'I will take it.', 'It comes with us.', 'Understood.'],
    retreat: ['Falling back.', 'Not today.', 'I hear you.', 'Away, then.'],
    heal:    ['A moment.', 'Let me breathe.', 'As you say.', 'Yes.'],
    bless:   ['...Arceus?', 'I felt that.', 'You are still there.', 'Then I am not alone.'],
    none:    ['...', 'Speak plainly.', 'What?', 'I do not understand.']
  };

  function parse(text) {
    const s = String(text || '').toLowerCase();
    for (const rule of RULES) {
      for (const w of rule.words) {
        if (s.indexOf(w) >= 0) return rule.intent;
      }
    }
    return 'none';
  }

  function ack(intent) {
    const list = ACK[intent] || ACK.none;
    return list[Math.floor(Math.random() * list.length)];
  }

  const api = { parse, ack, RULES };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.WHISPER = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* NAIL & SOUL — renderer, input and UI. Requires window.SIM. */
(function () {
  'use strict';
  const SIM = window.SIM;
  const AUTOPILOT = window.AUTOPILOT || null;
  const WHISPER = window.WHISPER || { parse: () => 'none', ack: () => '' };
  const SFX = window.SFX || { init() {}, play() {}, mute() {}, setVolume() {} };
  let audioReady = false;
  let muted = false;
  const lastPlayed = {};

  function sfx(name, opts) {
    if (!audioReady) return;
    const now = performance.now();
    if (lastPlayed[name] && now - lastPlayed[name] < 40) return;
    lastPlayed[name] = now;
    SFX.play(name, opts);
  }

  function wakeAudio() {
    if (audioReady) return;
    audioReady = true;
    SFX.init();
  }
  const W = SIM.W, H = SIM.H, FLOOR = SIM.FLOOR;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const input = { left: 0, right: 0, jump: 0, attack: 0, dash: 0, focus: 0, catch: 0 };
  let screen = 'title';      // title | fight | won | lost | captured
  let bossIndex = 0;
  let battle = null;
  let particles = [];
  let trails = [];
  let time = 0;
  let lastFrame = 0;
  let acc = 0;
  let endTimer = 0;
  let flash = 0;
  let hint = 1;
  let spectate = false;
  let lastDecision = 'WAIT';
  let whisper = { intent: 'none', ttl: 0, text: '', ack: '', ackT: 0 };

  function sendWhisper(text) {
    const clean = String(text || '').trim();
    if (!clean) return;
    const intent = WHISPER.parse(clean);
    whisper = { intent, ttl: 520, text: clean, ack: WHISPER.ack(intent), ackT: 200 };
    if (battle) battle.companionSay(whisper.ack, 150);
    if (!spectate && AUTOPILOT) spectate = true;   // a whisper wakes the pilot
  }
  let unlocked = 1;          // how many bosses are available, 1..BOSSES.length
  const SAVE_KEY = 'nailsoul.unlocked';

  function loadProgress() {
    try {
      const v = parseInt(localStorage.getItem(SAVE_KEY) || '1', 10);
      unlocked = Math.min(SIM.BOSSES.length, Math.max(1, v || 1));
    } catch (e) { unlocked = 1; }
  }

  function saveProgress() {
    try { localStorage.setItem(SAVE_KEY, String(unlocked)); } catch (e) {}
  }

  function unlockNext(index) {
    if (index + 2 > unlocked) {
      unlocked = Math.min(SIM.BOSSES.length, index + 2);
      saveProgress();
    }
  }

  loadProgress();

  const STEP = 1000 / 60;

  /* ---------------------------------------------------------------- input */

  const KEYS = {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    Space: 'jump', KeyW: 'jump', ArrowUp: 'jump',
    KeyJ: 'attack', KeyZ: 'attack',
    KeyK: 'dash', KeyX: 'dash',
    KeyL: 'focus', KeyC: 'focus',
    KeyE: 'catch'
  };

  addEventListener('keydown', (e) => {
    wakeAudio();
    if (e.code === 'KeyM') { muted = !muted; SFX.mute(muted); }
    if (e.code === 'KeyS' && AUTOPILOT) { spectate = !spectate; }
    if (KEYS[e.code]) { input[KEYS[e.code]] = 1; e.preventDefault(); }
    const digit = /^Digit([1-9])$/.exec(e.code);
    if (screen === 'title' && digit && Number(digit[1]) <= unlocked) {
      bossIndex = Number(digit[1]) - 1;
      startFight();
    }
    if (e.code === 'Enter' || e.code === 'Space') {
      if (screen === 'title') {
        bossIndex = Math.min(unlocked - 1, SIM.BOSSES.length - 1);
        startFight();
      } else if (screen === 'won' || screen === 'captured') {
        if (bossIndex + 1 < SIM.BOSSES.length) { bossIndex++; startFight(); }
        else { screen = 'title'; battle = null; }
      } else if (screen === 'lost') { screen = 'title'; battle = null; }
    }
  });

  addEventListener('keyup', (e) => {
    if (KEYS[e.code]) { input[KEYS[e.code]] = 0; e.preventDefault(); }
  });

  addEventListener('blur', () => {
    for (const k in input) input[k] = 0;
  });

  function bindTouch() {
    document.querySelectorAll('[data-key]').forEach((el) => {
      const key = el.dataset.key;
      const on = (e) => { e.preventDefault(); wakeAudio(); input[key] = 1; el.classList.add('held'); };
      const off = (e) => { e.preventDefault(); input[key] = 0; el.classList.remove('held'); };
      el.addEventListener('pointerdown', on);
      el.addEventListener('pointerup', off);
      el.addEventListener('pointercancel', off);
      el.addEventListener('pointerleave', off);
    });
    document.querySelectorAll('[data-boss]').forEach((el) => {
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault(); wakeAudio();
        bossIndex = Number(el.dataset.boss);
        startFight();
      });
    });
    canvas.addEventListener('pointerdown', (e) => {
      if (screen !== 'title') return;
      e.preventDefault();
      wakeAudio();
      const r = canvas.getBoundingClientRect();
      const px = ((e.clientX - r.left) / r.width) * W;
      const py = ((e.clientY - r.top) / r.height) * H;
      for (let i = 0; i < unlocked; i++) {
        const nx = 118 + i * 90;
        const ny = 320 + Math.sin(i * 0.92 + 0.4) * 58;
        if ((px - nx) ** 2 + (py - ny) ** 2 < 34 * 34) { bossIndex = i; startFight(); return; }
      }
    });

    const wInput = document.getElementById('whisper-input');
    const wSend = document.getElementById('whisper-send');
    if (wSend && wInput) {
      const fire = (e) => {
        e.preventDefault();
        wakeAudio();
        sendWhisper(wInput.value);
        wInput.value = '';
        wInput.blur();
      };
      wSend.addEventListener('pointerdown', fire);
      wInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') fire(e); });
    }
    document.querySelectorAll('[data-whisper]').forEach((el) => {
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault(); wakeAudio(); sendWhisper(el.dataset.whisper);
      });
    });

    const restart = document.getElementById('restart');
    if (restart) restart.addEventListener('pointerdown', (e) => {
      e.preventDefault(); screen = 'title'; battle = null;
    });
  }

  /* ------------------------------------------------------------ lifecycle */

  function startFight() {
    battle = new SIM.Battle(SIM.BOSSES[bossIndex], (Date.now() & 0xffff) | 1);
    particles = [];
    trails = [];
    screen = 'fight';
    endTimer = 0;
    hint = 1;
    document.body.dataset.boss = SIM.BOSSES[bossIndex].id;
  }

  /* -------------------------------------------------------------- effects */

  function spark(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = (0.4 + Math.random()) * (speed || 3);
      particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
        life: 18 + Math.random() * 16, max: 34,
        color, size: 1.5 + Math.random() * 2.5, grav: 0.16
      });
    }
  }

  function dust(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x: x + (Math.random() - 0.5) * 26, y: y - Math.random() * 8,
        vx: (Math.random() - 0.5) * 1.2, vy: -Math.random() * 1.4,
        life: 26 + Math.random() * 20, max: 46,
        color, size: 2 + Math.random() * 3, grav: -0.01
      });
    }
  }

  function consumeEvents() {
    if (!battle) return;
    const hue = SIM.BOSSES[bossIndex].hue;
    for (const e of battle.events) {
      switch (e.type) {
        case 'hitBoss': spark(e.x, e.y, '#ffe9c4', 12, 3.4); flash = Math.max(flash, 0.18); sfx('hit'); break;
        case 'hitPlayer': spark(e.x, e.y, '#ff7a5c', 16, 4); flash = Math.max(flash, 0.4); sfx('hurt'); break;
        case 'slash': spark(e.x + (e.facing ? 30 : -30), e.y - 40, '#dfe9ff', 6, 2.2); sfx('slash'); break;
        case 'dash': trails.push({ x: e.x, y: e.y, life: 16 }); sfx('dash'); break;
        case 'land': dust(e.x, e.y, '#6b7a90', 6); sfx('land'); break;
        case 'jump': dust(e.x, e.y, '#5d6b80', 3); sfx('jump'); break;
        case 'heal': spark(e.x, e.y, '#9be6c0', 20, 2.6); sfx('heal'); break;
        case 'focusTick': particles.push({ x: e.x + (Math.random() - 0.5) * 30, y: e.y, vx: 0, vy: -1.6, life: 22, max: 22, color: '#8fd7ff', size: 2, grav: 0 }); break;
        case 'phase': spark(e.x, e.y - 80, `hsl(${hue} 80% 70%)`, 40, 5); flash = 0.85; sfx('phase'); break;
        case 'stagger': spark(e.x, e.y - 80, '#ffd479', 26, 4); sfx('stagger'); break;
        case 'telegraph': {
          const d = Math.abs(battle.player.x - e.x);
          sfx('telegraph', { pitch: Math.min(1, Math.max(0, 1 - d / 520)) });
          break;
        }
        case 'swing': dust(e.x + (e.facing ? 50 : -50), e.y, `hsl(${hue} 60% 60%)`, 8); sfx('swing'); break;
        case 'capture': spark(e.x, e.y, '#ffd479', 50, 5); flash = 0.9; sfx('capture'); break;
        case 'bossDeath': spark(e.x, e.y - 80, `hsl(${hue} 70% 65%)`, 60, 6); flash = 0.9; sfx('victory'); break;
        case 'death': flash = 0.8; sfx('death'); break;
      }
    }
  }

  /* ---------------------------------------------------------------- draw */

  function sky(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#080b12');
    g.addColorStop(0.55, '#0d1220');
    g.addColorStop(1, '#070910');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // distant glow
    const gl = ctx.createRadialGradient(W * 0.5, H * 0.62, 20, W * 0.5, H * 0.62, 420);
    gl.addColorStop(0, 'rgba(90,140,190,0.10)');
    gl.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gl;
    ctx.fillRect(0, 0, W, H);

    // cave arches, three parallax layers
    const layers = [
      { p: 0.12, y: 0.30, amp: 54, col: '#0c1119', freq: 0.9 },
      { p: 0.26, y: 0.44, amp: 70, col: '#101724', freq: 0.6 },
      { p: 0.45, y: 0.60, amp: 88, col: '#151d2c', freq: 0.42 }
    ];
    for (const L of layers) {
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 8) {
        const s = x + (battle ? battle.player.x * L.p : 0);
        const y = H * L.y - Math.sin(s * 0.006 * L.freq) * L.amp
          - Math.sin(s * 0.013 * L.freq + 2.1) * L.amp * 0.42
          - Math.sin(s * 0.027 + t * 0.0002) * 8;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fillStyle = L.col;
      ctx.fill();
    }

    // dust motes
    for (let i = 0; i < 46; i++) {
      const seed = i * 97.13;
      const x = (seed * 37 + t * 0.012 * (1 + (i % 4))) % W;
      const y = ((seed * 61) % (H - 120)) + 40 + Math.sin(t * 0.0009 + i) * 12;
      const a = 0.05 + (i % 5) * 0.022;
      ctx.fillStyle = `rgba(190,215,255,${a})`;
      ctx.beginPath();
      ctx.arc(x, y, 1 + (i % 3) * 0.6, 0, 6.284);
      ctx.fill();
    }
  }

  function ground() {
    const g = ctx.createLinearGradient(0, FLOOR - 4, 0, H);
    g.addColorStop(0, '#1b2433');
    g.addColorStop(0.15, '#141b27');
    g.addColorStop(1, '#0a0d14');
    ctx.fillStyle = g;
    ctx.fillRect(0, FLOOR, W, H - FLOOR);
    ctx.fillStyle = 'rgba(150,190,235,0.16)';
    ctx.fillRect(0, FLOOR - 1, W, 2);
    // rubble
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    for (let i = 0; i < 40; i++) {
      const x = (i * 131) % W;
      const w = 6 + (i % 5) * 5;
      ctx.fillRect(x, FLOOR + 6 + (i % 3) * 7, w, 3);
    }
  }

  function drawShadow(x, y, w) {
    ctx.fillStyle = 'rgba(0,0,0,0.42)';
    ctx.beginPath();
    ctx.ellipse(x, y + 2, w, w * 0.26, 0, 0, 6.284);
    ctx.fill();
  }

  function drawPlayer(p, t) {
    const bob = p.onGround ? Math.sin(t * 0.008) * 1.6 : 0;
    const x = p.x;
    const y = p.y + bob;
    const face = p.facing ? 1 : -1;

    // dash afterimages
    for (const tr of trails) {
      ctx.globalAlpha = (tr.life / 16) * 0.25;
      ctx.fillStyle = '#9fc6ff';
      ctx.beginPath();
      ctx.ellipse(tr.x, tr.y - 26, 12, 20, 0, 0, 6.284);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawShadow(p.x, p.y, 16);

    if (p.hurt > 0 && (t / 40) % 2 < 1) ctx.globalAlpha = 0.45;

    // cloak
    const cloak = ctx.createLinearGradient(x, y - 52, x, y);
    cloak.addColorStop(0, '#e9eefb');
    cloak.addColorStop(0.55, '#b9c6dd');
    cloak.addColorStop(1, '#6d7c96');
    ctx.fillStyle = cloak;
    ctx.beginPath();
    ctx.moveTo(x - 13, y - 4);
    ctx.quadraticCurveTo(x - 16, y - 30, x - 7, y - 44);
    ctx.lineTo(x + 7, y - 44);
    ctx.quadraticCurveTo(x + 16, y - 30, x + 13, y - 4);
    ctx.closePath();
    ctx.fill();

    // head
    ctx.fillStyle = '#eef3ff';
    ctx.beginPath();
    ctx.ellipse(x, y - 50, 11, 12, 0, 0, 6.284);
    ctx.fill();

    // ears
    ctx.beginPath();
    ctx.moveTo(x - 8, y - 56);
    ctx.quadraticCurveTo(x - 16, y - 78, x - 5, y - 62);
    ctx.closePath();
    ctx.moveTo(x + 8, y - 56);
    ctx.quadraticCurveTo(x + 16, y - 78, x + 5, y - 62);
    ctx.closePath();
    ctx.fill();

    // eyes
    ctx.fillStyle = '#14181f';
    ctx.beginPath();
    ctx.ellipse(x + face * 3.4, y - 50, 1.7, 3.2, 0, 0, 6.284);
    ctx.ellipse(x - face * 2.6, y - 50, 1.7, 3.2, 0, 0, 6.284);
    ctx.fill();

    // legs
    const stride = p.onGround && Math.abs(p.vx) > 0.01 ? 0 : 0;
    const swing = p.onGround ? Math.sin(t * 0.016) * 3 : 4;
    ctx.strokeStyle = '#8b9ab4';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x - 4, y - 8); ctx.lineTo(x - 5 + swing + stride, y);
    ctx.moveTo(x + 4, y - 8); ctx.lineTo(x + 5 - swing, y);
    ctx.stroke();

    // nail
    if (p.swingT > 0) {
      const prog = 1 - p.swingT / 11;
      const ang = (-0.9 + prog * 2.0) * face;
      ctx.save();
      ctx.translate(x, y - 34);
      ctx.rotate(ang);
      const grad = ctx.createLinearGradient(0, 0, face * 54, 0);
      grad.addColorStop(0, 'rgba(220,240,255,0.15)');
      grad.addColorStop(0.4, 'rgba(235,248,255,0.95)');
      grad.addColorStop(1, 'rgba(190,225,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(face * 54, 0);
      ctx.stroke();
      ctx.restore();
    } else {
      ctx.strokeStyle = 'rgba(210,228,255,0.75)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(x + face * 10, y - 30);
      ctx.lineTo(x + face * 26, y - 44);
      ctx.stroke();
    }

    // focus aura
    if (p.focusT > 0) {
      const r = 14 + Math.sin(t * 0.02) * 3;
      const g2 = ctx.createRadialGradient(x, y - 30, 2, x, y - 30, r + 16);
      g2.addColorStop(0, 'rgba(150,220,255,0.55)');
      g2.addColorStop(1, 'rgba(150,220,255,0)');
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.arc(x, y - 30, r + 16, 0, 6.284);
      ctx.fill();
    }

    // dash iframes ring
    if (p.iframes > 0 && p.dashT > 0) {
      ctx.strokeStyle = `rgba(160,210,255,${0.5 * (p.iframes / 13)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(x, y - 26, 22, 30, 0, 0, 6.284);
      ctx.stroke();
    }

    ctx.globalAlpha = 1;
  }

  function drawCompanion(c, t) {
    if (!c) return;
    const bob = Math.sin(t * 0.006 + 1.2) * 2;
    const x = c.x, y = c.y + bob;
    const face = c.facing ? 1 : -1;

    drawShadow(c.x, c.y, 12);

    // cloak, cooler palette than the player
    const g = ctx.createLinearGradient(x, y - 42, x, y);
    g.addColorStop(0, '#cfe3ff');
    g.addColorStop(0.6, '#8fb0d8');
    g.addColorStop(1, '#4d6480');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x - 10, y - 3);
    ctx.quadraticCurveTo(x - 12, y - 26, x - 5, y - 36);
    ctx.lineTo(x + 5, y - 36);
    ctx.quadraticCurveTo(x + 12, y - 26, x + 10, y - 3);
    ctx.closePath();
    ctx.fill();

    // head + ears
    ctx.fillStyle = '#e6efff';
    ctx.beginPath();
    ctx.ellipse(x, y - 41, 8.5, 9, 0, 0, 6.284);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - 6, y - 46);
    ctx.quadraticCurveTo(x - 13, y - 63, x - 4, y - 50);
    ctx.closePath();
    ctx.moveTo(x + 6, y - 46);
    ctx.quadraticCurveTo(x + 13, y - 63, x + 4, y - 50);
    ctx.closePath();
    ctx.fill();

    // eyes
    ctx.fillStyle = '#16202e';
    ctx.beginPath();
    ctx.ellipse(x + face * 2.6, y - 41, 1.4, 2.6, 0, 0, 6.284);
    ctx.ellipse(x - face * 2.0, y - 41, 1.4, 2.6, 0, 0, 6.284);
    ctx.fill();

    // nail
    if (c.swingT > 0) {
      const prog = 1 - c.swingT / 10;
      const ang = (-0.9 + prog * 2.0) * face;
      ctx.save();
      ctx.translate(x, y - 28);
      ctx.rotate(ang);
      const ng = ctx.createLinearGradient(0, 0, face * 44, 0);
      ng.addColorStop(0, 'rgba(190,235,255,0.2)');
      ng.addColorStop(1, 'rgba(210,245,255,0.9)');
      ctx.strokeStyle = ng;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(face * 44, 0);
      ctx.stroke();
      ctx.restore();
    }

    // hp pips above him
    for (let i = 0; i < c.maxHp; i++) {
      ctx.fillStyle = i < c.hp ? 'rgba(150,220,255,0.9)' : 'rgba(150,220,255,0.16)';
      ctx.beginPath();
      ctx.arc(x - 8 + i * 8, y - 58, 2, 0, 6.284);
      ctx.fill();
    }

    // speech
    if (c.sayT > 0 && c.say) {
      const a = Math.min(1, c.sayT / 30);
      ctx.font = '400 11px "Fragment Mono", monospace';
      const w = ctx.measureText(c.say).width;
      const bx = Math.max(8, Math.min(W - w - 24, x - w / 2 - 8));
      const by = y - 84;
      ctx.fillStyle = `rgba(8,12,18,${0.85 * a})`;
      ctx.fillRect(bx, by, w + 16, 22);
      ctx.fillStyle = `rgba(255,212,121,${0.85 * a})`;
      ctx.fillRect(bx, by, 2, 22);
      ctx.fillStyle = `rgba(220,235,255,${a})`;
      ctx.textAlign = 'left';
      ctx.fillText(c.say, bx + 8, by + 15);
    }
  }

  function drawBoss(b, def, t) {
    const hue = def.hue;
    const s = def.size || 1;
    const x = b.x;
    const y = b.y;
    const face = b.facing === 1 ? 1 : -1;
    const stagger = b.state === 'stagger';
    const tilt = stagger ? Math.sin(t * 0.02) * 0.16 : 0;
    const phaseGlow = b.state === 'phase' ? 1 : 0;

    drawShadow(x, y, 34 * s);

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);

    // aura
    const auraR = 96 * s + (b.atkStage === 'tel' ? 18 : 0) + phaseGlow * 40;
    const aura = ctx.createRadialGradient(0, -60 * s, 8, 0, -60 * s, auraR);
    const pulse = b.atkStage === 'tel' ? 0.20 + 0.12 * Math.sin(t * 0.03) : 0.10;
    aura.addColorStop(0, `hsla(${hue},85%,60%,${pulse + phaseGlow * 0.3})`);
    aura.addColorStop(1, 'hsla(0,0%,0%,0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(0, -60 * s, auraR, 0, 6.284);
    ctx.fill();

    // body
    const bodyGrad = ctx.createLinearGradient(0, -120 * s, 0, 0);
    bodyGrad.addColorStop(0, `hsl(${hue},22%,26%)`);
    bodyGrad.addColorStop(0.6, `hsl(${hue},20%,16%)`);
    bodyGrad.addColorStop(1, `hsl(${hue},18%,9%)`);
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(-16 * s, 0);
    ctx.quadraticCurveTo(-30 * s, -46 * s, -18 * s, -86 * s);
    ctx.quadraticCurveTo(-12 * s, -104 * s, 0, -106 * s);
    ctx.quadraticCurveTo(12 * s, -104 * s, 18 * s, -86 * s);
    ctx.quadraticCurveTo(30 * s, -46 * s, 16 * s, 0);
    ctx.closePath();
    ctx.fill();

    // rim light
    ctx.strokeStyle = `hsla(${hue},60%,62%,0.5)`;
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // helm
    ctx.fillStyle = `hsl(${hue},18%,20%)`;
    ctx.beginPath();
    ctx.ellipse(0, -96 * s, 15 * s, 16 * s, 0, 0, 6.284);
    ctx.fill();
    // horns
    ctx.beginPath();
    ctx.moveTo(-11 * s, -104 * s);
    ctx.quadraticCurveTo(-26 * s, -140 * s, -6 * s, -112 * s);
    ctx.closePath();
    ctx.moveTo(11 * s, -104 * s);
    ctx.quadraticCurveTo(26 * s, -140 * s, 6 * s, -112 * s);
    ctx.closePath();
    ctx.fillStyle = `hsl(${hue},20%,24%)`;
    ctx.fill();

    // eyes
    const eyeGlow = b.atkStage === 'tel' ? 1 : 0.65;
    ctx.fillStyle = `hsla(${hue},95%,72%,${eyeGlow})`;
    ctx.beginPath();
    ctx.ellipse(-5 * s, -97 * s, 2.6 * s, 4.2 * s, 0, 0, 6.284);
    ctx.ellipse(5 * s, -97 * s, 2.6 * s, 4.2 * s, 0, 0, 6.284);
    ctx.fill();

    // blade
    let bladeAng = 0.5;
    if (b.atkStage === 'tel') bladeAng = 0.5 - 1.5 * (1 - b.atkT / (b.atk ? b.atk.tel : 1));
    else if (b.atkStage === 'act') bladeAng = -1.0 + 1.9 * (1 - b.atkT / (b.atk ? b.atk.act : 1));
    else if (stagger) bladeAng = 1.5;
    ctx.save();
    ctx.translate(face * 14 * s, -62 * s);
    ctx.rotate(bladeAng * face);
    const bg = ctx.createLinearGradient(0, 0, face * 92 * s, 0);
    bg.addColorStop(0, `hsla(${hue},30%,40%,0.9)`);
    bg.addColorStop(1, `hsla(${hue},70%,${b.atkStage === 'act' ? 82 : 62}%,0.95)`);
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(0, -3.5);
    ctx.lineTo(face * 92 * s, -1.5);
    ctx.lineTo(face * 96 * s, 0);
    ctx.lineTo(face * 92 * s, 2.5);
    ctx.lineTo(0, 4.5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // hit flash
    if (b.flash > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255,240,220,${b.flash / 12})`;
      ctx.beginPath();
      ctx.ellipse(0, -56 * s, 34 * s, 62 * s, 0, 0, 6.284);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }

    // stagger stars
    if (stagger) {
      for (let i = 0; i < 3; i++) {
        const a = t * 0.006 + i * 2.1;
        ctx.fillStyle = `rgba(255,212,121,${0.5 + 0.4 * Math.sin(t * 0.01 + i)})`;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * 26, -120 * s + Math.sin(a) * 8, 2.6, 0, 6.284);
        ctx.fill();
      }
    }

    ctx.restore();
  }

  function drawParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.grav;
      p.life--;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, 6.284);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (let i = trails.length - 1; i >= 0; i--) {
      trails[i].life--;
      if (trails[i].life <= 0) trails.splice(i, 1);
    }
  }

  function drawHUD() {
    const p = battle.player, b = battle.boss, def = SIM.BOSSES[bossIndex];

    // masks
    for (let i = 0; i < SIM.P.masks; i++) {
      const x = 34 + i * 30, y = 40;
      const full = i < p.masks;
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();
      ctx.moveTo(0, -11);
      ctx.quadraticCurveTo(11, -6, 11, 2);
      ctx.quadraticCurveTo(11, 10, 0, 14);
      ctx.quadraticCurveTo(-11, 10, -11, 2);
      ctx.quadraticCurveTo(-11, -6, 0, -11);
      ctx.closePath();
      ctx.fillStyle = full ? '#eef3ff' : 'rgba(255,255,255,0.10)';
      ctx.fill();
      ctx.strokeStyle = full ? 'rgba(180,205,240,0.8)' : 'rgba(255,255,255,0.14)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.restore();
    }

    // soul orb
    const cx = 34, cy = 96, r = 21;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 6.284);
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(180,205,240,0.35)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    const frac = p.soul / SIM.P.soulMax;
    if (frac > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r - 3, 0, 6.284);
      ctx.clip();
      const lvl = cy + (r - 3) - (r - 3) * 2 * frac;
      const g = ctx.createLinearGradient(0, lvl, 0, cy + r);
      g.addColorStop(0, 'rgba(190,235,255,0.95)');
      g.addColorStop(1, 'rgba(90,160,220,0.75)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, lvl + (r - 3), (r - 3) * 1.6, 0, 6.284);
      ctx.fill();
      ctx.restore();
    }
    if (p.soul >= SIM.P.focusCost) {
      ctx.strokeStyle = `rgba(190,235,255,${0.35 + 0.25 * Math.sin(time * 0.005)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, r + 3, 0, 6.284);
      ctx.stroke();
    }

    // boss bar
    const bw = 460, bx = (W - bw) / 2, by = H - 46;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(bx - 2, by - 2, bw + 4, 16);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(bx, by, bw, 12);
    const hpFrac = b.hp / b.maxHp;
    const barGrad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    barGrad.addColorStop(0, `hsl(${def.hue},70%,52%)`);
    barGrad.addColorStop(1, `hsl(${def.hue},85%,68%)`);
    ctx.fillStyle = barGrad;
    ctx.fillRect(bx, by, bw * hpFrac, 12);

    // phase ticks
    for (const pct of [def.phase2, def.phase3]) {
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(bx + bw * (pct / 100), by - 3, 2, 18);
    }

    ctx.font = '600 13px "Fragment Mono", monospace';
    ctx.fillStyle = 'rgba(220,232,255,0.85)';
    ctx.textAlign = 'center';
    ctx.fillText(`${def.name.toUpperCase()}   ·   PHASE ${b.phase}`, W / 2, by - 12);

    // companion readout
    if (battle.companion) {
      const c = battle.companion;
      ctx.font = '400 10.5px "Fragment Mono", monospace';
      ctx.fillStyle = 'rgba(150,200,255,0.55)';
      ctx.fillText(`COMPANION  ${c.state.toUpperCase()}  ·  ${c.mood}  ·  energy ${Math.round(c.energy)}`, 34, H - 18);
    }

    // capture prompt
    const canCatch = b.hp / b.maxHp <= 0.15 && b.hp > 0;
    if (canCatch) {
      const a = 0.55 + 0.45 * Math.sin(time * 0.008);
      ctx.font = '600 15px "Fragment Mono", monospace';
      ctx.fillStyle = `rgba(255,212,121,${a})`;
      ctx.fillText('HOLD  E  /  CATCH  —  the creature is weak', W / 2, by - 34);
      if (battle.captureT) {
        ctx.fillStyle = 'rgba(255,212,121,0.9)';
        ctx.fillRect(W / 2 - 70, by - 26, 140 * (battle.captureT / 36), 3);
      }
    }
    ctx.textAlign = 'left';
  }

  /* --------------------------------------------------------------- frames */

  function frame(now) {
    requestAnimationFrame(frame);
    if (!lastFrame) lastFrame = now;
    let delta = Math.min(120, now - lastFrame);
    lastFrame = now;
    time = now;

    if (screen === 'fight' && battle) {
      acc += delta;
      let steps = 0;
      while (acc >= STEP && steps < 5) {
        if (spectate && AUTOPILOT) {
          const a = AUTOPILOT.think(battle, time, whisper);
          lastDecision = a.decision;
          battle.step(a);
        } else {
          battle.step(input);
        }
        consumeEvents();
        acc -= STEP;
        steps++;
      }
      if (whisper.ttl > 0) whisper.ttl--;
      if (whisper.ackT > 0) whisper.ackT--;

      if (battle.outcome !== 'ongoing') {
        if (battle.outcome !== 'lost' && !battle._counted) {
          battle._counted = true;
          unlockNext(bossIndex);
        }
        endTimer += delta;
        if (endTimer > 700) {
          screen = battle.outcome === 'won' ? 'won'
            : battle.outcome === 'captured' ? 'captured' : 'lost';
        }
      }
    }

    render(delta);
  }

  function render(delta) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const shake = battle && battle.shake > 0.2 ? battle.shake : 0;
    ctx.save();
    if (shake) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    sky(time);
    ground();

    if (battle) {
      drawBoss(battle.boss, SIM.BOSSES[bossIndex], time);
      drawCompanion(battle.companion, time);
      drawPlayer(battle.player, time);
      drawParticles(delta);
    }

    ctx.restore();

    if (battle && screen === 'fight') {
      drawHUD();
      const bar = document.getElementById('whisper');
      if (bar) bar.style.display = spectate ? 'flex' : 'none';
      if (whisper.ttl > 0) {
        ctx.font = '600 10px "Fragment Mono", monospace';
        ctx.fillStyle = 'rgba(255,212,121,0.55)';
        ctx.textAlign = 'center';
        ctx.fillText('WHISPER: ' + whisper.text.toUpperCase(), W / 2, 26);
        if (whisper.ackT > 0) {
          ctx.font = 'italic 400 11px "Fragment Mono", monospace';
          ctx.fillStyle = `rgba(190,220,255,${Math.min(1, whisper.ackT / 60) * 0.8})`;
          ctx.fillText('"' + whisper.ack + '"', W / 2, 44);
        }
        ctx.textAlign = 'left';
      }

      if (spectate) {
        ctx.font = '600 11px "Fragment Mono", monospace';
        ctx.fillStyle = 'rgba(255,212,121,0.9)';
        ctx.textAlign = 'right';
        ctx.fillText('AI PILOT', W - 34, 34);
        ctx.font = '400 11px "Fragment Mono", monospace';
        ctx.fillStyle = 'rgba(190,210,240,0.65)';
        ctx.fillText(lastDecision, W - 34, 52);
        ctx.textAlign = 'left';
      }
    }

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,240,220,${flash})`;
      ctx.fillRect(0, 0, W, H);
      flash *= 0.86;
    }

    // vignette
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    drawOverlay();
  }

  function drawOverlay() {
    const wbar = document.getElementById('whisper');
    if (wbar) wbar.style.display = 'none';

    if (screen === 'title') {
      ctx.fillStyle = 'rgba(6,9,14,0.86)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';

      ctx.font = '700 54px "Bricolage Grotesque", Georgia, serif';
      ctx.fillStyle = '#eef3ff';
      ctx.fillText('NAIL & SOUL', W / 2, 116);

      ctx.font = '400 14px "Fragment Mono", monospace';
      ctx.fillStyle = 'rgba(190,210,240,0.5)';
      ctx.fillText('a Hollow Knight-style action game with a catching mechanic', W / 2, 144);

      ctx.font = '400 11.5px "Fragment Mono", monospace';
      ctx.fillStyle = 'rgba(190,210,240,0.32)';
      ctx.fillText('A / D move    SPACE jump    J nail    K dash    L focus    E catch    M mute', W / 2, 170);

      // the path
      const nodes = SIM.BOSSES.map((b, i) => ({
        b, i,
        x: 118 + i * 90,
        y: 320 + Math.sin(i * 0.92 + 0.4) * 58
      }));

      ctx.strokeStyle = 'rgba(150,180,230,0.16)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      nodes.forEach((n, k) => (k ? ctx.lineTo(n.x, n.y) : ctx.moveTo(n.x, n.y)));
      ctx.stroke();

      for (const n of nodes) {
        const open = n.i < unlocked;
        const done = n.i < unlocked - 1;
        const isNext = n.i === unlocked - 1;

        if (open) {
          const glow = ctx.createRadialGradient(n.x, n.y, 2, n.x, n.y, 40);
          glow.addColorStop(0, `hsla(${n.b.hue},70%,60%,0.28)`);
          glow.addColorStop(1, 'hsla(0,0%,0%,0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(n.x, n.y, 40, 0, 6.284);
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(n.x, n.y, 19, 0, 6.284);
        ctx.fillStyle = open ? `hsl(${n.b.hue},30%,16%)` : 'rgba(255,255,255,0.03)';
        ctx.fill();
        ctx.strokeStyle = open ? `hsl(${n.b.hue},65%,58%)` : 'rgba(255,255,255,0.10)';
        ctx.lineWidth = isNext ? 2.4 : 1.4;
        ctx.stroke();

        ctx.font = '600 14px "Fragment Mono", monospace';
        ctx.fillStyle = open ? '#eef3ff' : 'rgba(255,255,255,0.16)';
        ctx.fillText(done ? '\u2713' : String(n.i + 1), n.x, n.y + 5);

        if (open) {
          ctx.font = '400 10px "Fragment Mono", monospace';
          ctx.fillStyle = isNext ? 'rgba(255,212,121,0.85)' : 'rgba(190,210,240,0.42)';
          const nm = n.b.name.replace(' of the Grove', '').replace(' of Ash', '');
          ctx.fillText(nm.length > 15 ? nm.slice(0, 14) + '\u2026' : nm, n.x, n.y + 36);
        }
        if (isNext) {
          ctx.font = '400 9px "Fragment Mono", monospace';
          ctx.fillStyle = `rgba(255,212,121,${0.35 + 0.3 * Math.sin(time * 0.005)})`;
          ctx.fillText('NEXT', n.x, n.y - 30);
        }
      }

      ctx.font = '400 12px "Fragment Mono", monospace';
      ctx.fillStyle = 'rgba(190,210,240,0.4)';
      ctx.fillText(`${Math.min(unlocked, SIM.BOSSES.length)} / ${SIM.BOSSES.length} reachable  ·  tap a node or press 1–9`, W / 2, H - 64);
      ctx.fillStyle = `rgba(255,212,121,${0.45 + 0.35 * Math.sin(time * 0.004)})`;
      ctx.fillText('ENTER — fight the next one     S — watch the AI play it', W / 2, H - 40);
      ctx.textAlign = 'left';
    }

    if (screen === 'won' || screen === 'captured' || screen === 'lost') {
      const win = screen !== 'lost';
      ctx.fillStyle = 'rgba(6,9,14,0.78)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.font = '700 54px "Bricolage Grotesque", Georgia, serif';
      ctx.fillStyle = win ? '#ffd479' : '#ff8a72';
      ctx.fillText(screen === 'captured' ? 'CAPTURED' : win ? 'THE KNIGHT FALLS' : 'YOU DIED', W / 2, H / 2 - 30);
      ctx.font = '400 15px "Fragment Mono", monospace';
      ctx.fillStyle = 'rgba(190,210,240,0.6)';
      ctx.fillText(
        screen === 'captured'
          ? 'the creature joins you — a bond struck in the dark'
          : win ? 'the arena falls silent'
          : 'the dark takes another wanderer',
        W / 2, H / 2 + 10);
      ctx.fillStyle = `rgba(255,212,121,${0.5 + 0.4 * Math.sin(time * 0.004)})`;
      const nextName = win && bossIndex + 1 < SIM.BOSSES.length
        ? `ENTER — next: ${SIM.BOSSES[bossIndex + 1].name}` : 'ENTER — return to the path';
      ctx.fillText(nextName, W / 2, H / 2 + 56);
      ctx.textAlign = 'left';
    }
  }

  /* ----------------------------------------------------------------- boot */

  function fit() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = Math.floor(W * scale) + 'px';
    canvas.style.height = Math.floor(H * scale) + 'px';
  }

  addEventListener('resize', fit);
  fit();
  bindTouch();
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
